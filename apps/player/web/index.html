<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devex game</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: #ccc; font: 16px sans-serif; }
</style>
</head>
<body>
<!-- The page of a Devex game: it loads game.dvxpak, beside it, into the files of the program, then plays it in the
     canvas with WebGPU, or with WebGL2 in a browser without it. -->
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
    // Thread Support, which the export turns on: the player with threads, where the host sent the headers COOP and COEP.
    const devexThreads = false;
    const status = document.getElementById('status');
    var Module = {
        canvas: document.getElementById('canvas'),
        arguments: ['--package', '/game.dvxpak'],
        preRun: [() => {
            if (!navigator.gpu && !document.createElement('canvas').getContext('webgl2')) {
                status.textContent = 'This browser has neither WebGPU nor WebGL2: the game cannot be drawn.';
            }
            Module.addRunDependency('game');
            fetch('game.dvxpak')
                .then((response) => {
                    if (!response.ok) {
                        throw new Error(response.status + ' ' + response.statusText);
                    }
                    return response.arrayBuffer();
                })
                .then((bytes) => {
                    Module.FS.writeFile('/game.dvxpak', new Uint8Array(bytes));
                    status.remove();
                    Module.removeRunDependency('game');
                })
                .catch((error) => { status.textContent = 'The game cannot be loaded: ' + error.message; });
        }],
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
        // The game has quit: the page says so in place of its last picture.
        devexEnded: () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
            document.exitPointerLock();
            Module.canvas.style.display = 'none';
            status.textContent = 'The game has ended.';
            document.body.appendChild(status);
        },
    };
    const player = document.createElement('script');
    player.src = devexThreads && self.crossOriginIsolated ? 'devex-player-threads.js' : 'devex-player.js';
    document.body.appendChild(player);
</script>
</body>
</html>
