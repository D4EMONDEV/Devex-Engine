# Builds the engine, the editor, the player and the tests, then runs every test that needs no GPU,
# in Debug and in Release, on Windows and on Linux, on each push to main and on each pull request.
# The machines of GitHub have no GPU: on Linux, the tests tagged [gpu] run on lavapipe, the Vulkan of
# Mesa that draws on the processor; on Windows, on developers' machines only. The Release builds are
# installed and kept as downloads: devex-windows-x64 and devex-linux-x64. The Linux one then exports
# the sandbox, which plays on a bare Ubuntu and is kept too: sandbox-linux-x64.
name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the check under way pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.preset }}
    # Windows Server 2025 with Visual Studio 2026, the compiler the engine is written for.
    runs-on: windows-2025
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, x64-release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Only slangc is taken from the SDK: the headers and volk come from vcpkg.
      - name: Set up the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.350.0
          install_runtime: false
          cache: true

      # The last action still on Node.js 20, which GitHub runs on Node.js 24 regardless: it has no
      # newer version yet.
      - name: Set up the compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The generator of the presets: neither the image nor its Visual Studio put it on the path.
      - name: Set up Ninja
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ninja"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile "$dir/ninja.zip"
          Expand-Archive "$dir/ninja.zip" -DestinationPath $dir -Force
          $dir >> $env:GITHUB_PATH

      # A whole clone of vcpkg, whose history holds the ports at the baseline of vcpkg.json: a
      # partial one makes vcpkg fetch the older ports while it installs, which fails there. And a
      # folder for the packages it builds, kept from one run to the next.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          $archives = Join-Path $env:RUNNER_TEMP "vcpkg-archives"
          git clone --quiet https://github.com/microsoft/vcpkg.git $root
          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          New-Item -ItemType Directory -Force $archives | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$archives" >> $env:GITHUB_ENV

      # A cache of other dependencies serves too: vcpkg names each package by the hash of what built
      # it, and rebuilds only those that changed.
      - name: Restore the packages vcpkg built
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      # vcpkg builds the dependencies here, the first time for hours, then from its cache. What the
      # steps print is also kept in a file (cmd merges the errors in), for the failure to be shown.
      - name: Configure
        id: configure
        run: cmd /c "cmake --preset ${{ matrix.preset }} -DDEVEX_WARNINGS_AS_ERRORS=ON 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP/configure.log"

      # Saved as soon as the dependencies are built, so that a failing build or test does not
      # lose them.
      - name: Keep the packages vcpkg built
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**') }}

      - name: Build
        id: build
        run: cmd /c "cmake --build out/build/${{ matrix.preset }} 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"

      - name: Test
        id: test
        run: cmd /c "ctest --test-dir out/build/${{ matrix.preset }} --label-exclude gpu --output-on-failure --no-tests=error --timeout 600 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP/test.log"

      # The engine of this push, installed as a folder that works on its own (cmake --install): the
      # summary of the run offers it to download, for 30 days.
      - name: Pack the engine
        id: pack
        if: matrix.preset == 'x64-release'
        run: cmd /c "cmake --install out/build/${{ matrix.preset }} --prefix ""$env:RUNNER_TEMP/devex-windows-x64"" 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP/pack.log"

      - name: Keep the engine
        if: matrix.preset == 'x64-release'
        uses: actions/upload-artifact@v7
        with:
          name: devex-windows-x64
          path: ${{ runner.temp }}/devex-windows-x64
          retention-days: 30

      # Reading the logs of a run takes rights on the repository: what failed is also given as
      # annotations, which the summary of the run shows to everyone.
      - name: Show what failed
        if: failure()
        shell: pwsh
        env:
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          PACK: ${{ steps.pack.outcome }}
        run: |
          # The logs of the step that failed: the configuration with vcpkg and the port it failed to
          # build last, or the errors of the build, or those of the tests, or the end of the install.
          $logs = @()
          if ($env:CONFIGURE -eq "failure") {
            $logs += @{ Path = "$env:RUNNER_TEMP/configure.log"; Errors = $false }
            $logs += @{ Path = "out/build/${{ matrix.preset }}/vcpkg-manifest-install.log"; Errors = $false }
            $port = Get-ChildItem -Path "$env:RUNNER_TEMP/vcpkg/buildtrees" -Recurse -Filter "*-err.log" -ErrorAction SilentlyContinue |
              Where-Object Length -gt 0 | Sort-Object LastWriteTime | Select-Object -Last 1
            if ($port) { $logs += @{ Path = $port.FullName; Errors = $false } }
          }
          if ($env:BUILD -eq "failure") { $logs += @{ Path = "$env:RUNNER_TEMP/build.log"; Errors = $true } }
          if ($env:TEST -eq "failure") { $logs += @{ Path = "$env:RUNNER_TEMP/test.log"; Errors = $true } }
          if ($env:PACK -eq "failure") { $logs += @{ Path = "$env:RUNNER_TEMP/pack.log"; Errors = $false } }
          foreach ($log in $logs) {
            if (-not (Test-Path $log.Path)) { continue }
            $lines = Get-Content $log.Path
            if ($log.Errors) {
              $found = $lines | Select-String -Pattern "error|FAILED|Failed" | Select-Object -First 40 | ForEach-Object Line
              if ($found) { $lines = $found }
            }
            $text = (($lines | Select-Object -Last 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=$(Split-Path $log.Path -Leaf)::$text"
          }

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            out/build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  linux:
    name: Linux ${{ matrix.preset }}
    # Ubuntu 24.04 with GCC 14, the compiler of the distributions.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release]
    env:
      CC: gcc-14
      CXX: g++-14
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      VCPKG_DISABLE_METRICS: 1
    # bash -eo pipefail: a command piped into tee fails its step. The default shell of the steps,
    # bash -e, kept the status of tee alone, and showed configurations and builds that had failed
    # as passed, with an empty engine to download.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The compiler, the generator, what vcpkg needs to build its ports (libltdl-dev for the
      # autotools of libxcrypt), the headers SDL3 is built against for X11, Wayland, libdecor and the
      # sound, and lavapipe with the Vulkan loader for the tests tagged [gpu].
      - name: Install the packages of the system
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14 g++-14 ninja-build pkg-config autoconf autoconf-archive \
            automake libtool libltdl-dev bison flex nasm libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev libdbus-1-dev \
            libudev-dev libibus-1.0-dev libpulse-dev libasound2-dev libdecor-0-dev libvulkan1 \
            mesa-vulkan-drivers vulkan-tools

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Only slangc is taken from the SDK: the headers and volk come from vcpkg.
      - name: Set up the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.350.0
          install_runtime: false
          cache: true

      # A whole clone of vcpkg, as on Windows, and a folder for the packages it builds.
      - name: Set up vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          archives="$RUNNER_TEMP/vcpkg-archives"
          git clone --quiet https://github.com/microsoft/vcpkg.git "$root"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$archives"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$archives" >> "$GITHUB_ENV"

      # A cache of other dependencies serves too: vcpkg names each package by the hash of what built
      # it, and rebuilds only those that changed.
      - name: Restore the packages vcpkg built
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }} -DDEVEX_WARNINGS_AS_ERRORS=ON 2>&1 | tee "$RUNNER_TEMP/configure.log"

      - name: Keep the packages vcpkg built
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**') }}

      - name: Build
        id: build
        run: cmake --build out/build/${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # No display: the tests that open a window are tagged [gpu], and run in the next step.
      - name: Test
        id: test
        run: ctest --test-dir out/build/${{ matrix.preset }} --label-exclude gpu --output-on-failure --no-tests=error --timeout 600 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The tests tagged [gpu] on lavapipe, in windows without a screen: SDL's offscreen video driver
      # gives Vulkan a headless surface (VK_EXT_headless_surface). The summary of the device comes
      # first in the log, for when its version of Vulkan is too old.
      - name: Test on Vulkan drawn by the processor
        id: test-gpu
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export VK_DRIVER_FILES
          vulkaninfo --summary 2>&1 | tee "$RUNNER_TEMP/test-gpu.log"
          ctest --test-dir out/build/${{ matrix.preset }} --label-regex gpu --output-on-failure --no-tests=error --timeout 1200 2>&1 | tee -a "$RUNNER_TEMP/test-gpu.log"

      # The same engine for Linux, packed in a tar.gz, which keeps the programs executable, once it
      # is checked whole: programs, libraries, resources, shaders, slangc, C# and CMake package.
      - name: Pack the engine
        id: pack
        if: matrix.preset == 'linux-release'
        run: |
          cmake --install out/build/${{ matrix.preset }} --prefix "$RUNNER_TEMP/devex-linux-x64" 2>&1 | tee "$RUNNER_TEMP/pack.log"
          scripts/check_engine_package.sh "$RUNNER_TEMP/devex-linux-x64" 2>&1 | tee -a "$RUNNER_TEMP/pack.log"
          tar -czf "$RUNNER_TEMP/devex-linux-x64.tar.gz" -C "$RUNNER_TEMP" devex-linux-x64 2>&1 | tee -a "$RUNNER_TEMP/pack.log"
          du -h "$RUNNER_TEMP/devex-linux-x64.tar.gz" | tee -a "$RUNNER_TEMP/pack.log"

      - name: Keep the engine
        if: matrix.preset == 'linux-release'
        uses: actions/upload-artifact@v7
        with:
          name: devex-linux-x64
          path: ${{ runner.temp }}/devex-linux-x64.tar.gz
          retention-days: 30

      # The sandbox, exported by the engine just packed as from the download (C++, C# and shaders of
      # the project built by it), then played without the editor on a bare Ubuntu: a container with
      # the Vulkan loader and Mesa, nothing to build with, the folder of the game read only as once
      # installed. The script lists what the game takes from the system.
      - name: Export the sandbox and play it on a bare Ubuntu
        id: export
        if: matrix.preset == 'linux-release'
        run: |
          "$RUNNER_TEMP/devex-linux-x64/bin/devex-editor" --export samples/sandbox/Sandbox.dvxproj \
            --output "$RUNNER_TEMP/sandbox-linux-x64" 2>&1 | tee "$RUNNER_TEMP/export.log"
          docker run --rm -v "$RUNNER_TEMP/sandbox-linux-x64:/game:ro" -v "$PWD/scripts:/scripts:ro" ubuntu:24.04 \
            sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends libvulkan1 mesa-vulkan-drivers > /dev/null && /scripts/play_exported_game.sh /game 60" \
            2>&1 | tee -a "$RUNNER_TEMP/export.log"
          tar -czf "$RUNNER_TEMP/sandbox-linux-x64.tar.gz" -C "$RUNNER_TEMP" sandbox-linux-x64

      # The exported sandbox, to try on other machines.
      - name: Keep the exported sandbox
        if: matrix.preset == 'linux-release'
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-linux-x64
          path: ${{ runner.temp }}/sandbox-linux-x64.tar.gz
          retention-days: 14

      # The same annotations as on Windows, for those who cannot read the logs.
      - name: Show what failed
        if: failure()
        env:
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          PACK: ${{ steps.pack.outcome }}
          TEST_GPU: ${{ steps.test-gpu.outcome }}
          EXPORT: ${{ steps.export.outcome }}
        run: |
          # The annotations do their best: a grep cut short by head is no failure here.
          set +e +o pipefail
          annotate() {
            local path="$1" errors="$2" text
            [ -f "$path" ] || return 0
            if [ "$errors" = yes ] && grep -qE "error|FAILED|Failed" "$path"; then
              text=$(grep -E "error|FAILED|Failed" "$path" | head -40 | tail -60)
            else
              text=$(tail -60 "$path")
            fi
            text=${text//'%'/'%25'}
            text=${text//$'\r'/'%0D'}
            text=${text//$'\n'/'%0A'}
            echo "::error title=$(basename "$path")::$text"
          }
          if [ "$CONFIGURE" = failure ]; then
            annotate "$RUNNER_TEMP/configure.log" no
            annotate "out/build/${{ matrix.preset }}/vcpkg-manifest-install.log" no
            port=$(find "$RUNNER_TEMP/vcpkg/buildtrees" -name "*-err.log" -size +0 -printf "%T@ %p\n" 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
            [ -n "$port" ] && annotate "$port" no
          fi
          [ "$BUILD" = failure ] && annotate "$RUNNER_TEMP/build.log" yes
          [ "$TEST" = failure ] && annotate "$RUNNER_TEMP/test.log" yes
          [ "$TEST_GPU" = failure ] && annotate "$RUNNER_TEMP/test-gpu.log" yes
          [ "$EXPORT" = failure ] && annotate "$RUNNER_TEMP/export.log" no
          # The end of the install, and the room left on the disks it writes to.
          if [ "$PACK" = failure ]; then
            df -h . "$RUNNER_TEMP" >> "$RUNNER_TEMP/pack.log" 2>&1
            annotate "$RUNNER_TEMP/pack.log" no
          fi
          true

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
            out/build/${{ matrix.preset }}/vcpkg-manifest-install.log
            ${{ runner.temp }}/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
